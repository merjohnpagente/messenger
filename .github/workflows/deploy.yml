name: Deploy Messenger Web to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Run tests (non-blocking)
        run: flutter test || true

      - name: Build Web (release)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PUB: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Build args — use secrets if set, else empty (Dart defaults handle TURN)
          ARGS="--base-href /${{ github.event.repository.name }}/"
          if [ -n "$SUPABASE_URL" ]; then ARGS="$ARGS --dart-define=SUPABASE_URL=$SUPABASE_URL"; fi
          # Support both anon (eyJ) and new publishable (sb_publishable_)
          KEY="${SUPABASE_ANON:-$SUPABASE_PUB}"
          if [ -n "$KEY" ]; then
            ARGS="$ARGS --dart-define=SUPABASE_ANON_KEY=$KEY --dart-define=SUPABASE_PUBLISHABLE_KEY=$KEY"
          fi
          echo "Building with: flutter build web --release $ARGS"
          flutter build web --release $ARGS
          # SPA fallback for GitHub Pages — copy index.html to 404.html
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
