name: messenger
description: Messenger by Meta-style chat application built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  intl: ^0.19.0
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.5.6
  go_router: ^14.6.2
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0
  permission_handler: ^11.3.0
  image_picker: ^1.0.7
  file_picker: ^8.0.6
  flutter_webrtc: ^1.0.11
  wakelock_plus: ^1.2.5
  flutter_image_compress: ^2.1.0
  cached_network_image: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/app_logo.png
    - assets/images/app_logo.svg
    - assets/images/app_logo_fg.png