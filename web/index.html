<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Messenger — Modern Chat. Fast, secure, realtime chat & HD voice/video calls. Works on mobile, tablet & desktop.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Messenger">
  <meta name="application-name" content="Messenger">
  <meta name="msapplication-TileColor" content="#0084FF">
  <meta name="theme-color" content="#0084FF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Messenger — Modern Chat">
  <meta property="og:description" content="Modern Messenger — fast, secure, realtime chat & HD calls">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Messenger — Modern Chat">
  <meta name="twitter:description" content="Fast, secure, realtime chat & HD voice/video calls.">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Messenger — Modern Chat</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { background: #0084FF; margin: 0; -webkit-font-smoothing: antialiased; }
    .loader {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white; flex-direction: column; gap: 16px;
    }
    .loader-ring { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    noscript { display:flex; align-items:center; justify-content:center; height:100vh; color:white; font-family:sans-serif; text-align:center; padding:24px; }
  </style>
</head>
<body>
  <div id="loader" class="loader" role="status" aria-live="polite" aria-label="Loading Messenger">
    <div class="loader-ring" aria-hidden="true"></div>
    <div style="font-weight:600;letter-spacing:.3px">Messenger</div>
    <div style="font-size:12px;opacity:.85;letter-spacing:.4px">Modern Chat • Loading…</div>
  </div>
  <noscript>
    <p>Messenger needs JavaScript enabled to run. Please enable JavaScript and reload.</p>
  </noscript>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var l = document.getElementById('loader');
      if (l) l.style.display = 'none';
    });
    // GH Pages SPA fallback safety: if 404 trick not applied, redirect hash fallback is handled by Flutter
  </script>
</body>
</html>
